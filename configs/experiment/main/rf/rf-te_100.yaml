# @package _global_

defaults:
  - /experiment/base-100.yaml
  - _self_

env:
  generator_params:
    variant_preset: "all"
    sample_problem: True
    two_task: False
  data_dir: data_train
model:
  _target_: routefinder.models.model.RouteFinderBase
  automatic_optimization: False
  if_norm: True
  policy:
    _target_: routefinder.models.policy.RouteFinderPolicy
    normalization: "rms"
    encoder_use_prenorm: True
    encoder_use_post_layers_norm: True
    parallel_gated_kwargs:
      mlp_activation: "silu"

logger:
  project_name: "rf-te-100"
  tensorboard:
    save_dir: logs/baseline/${logger.project_name}/tensorboard/

callbacks:
  model_checkpoint:
    dirpath: pretrain_baseline/${logger.project_name}
hydra:
  run:
    dir:  logs/baseline/${logger.project_name}/tensorboard/
devices: 0
